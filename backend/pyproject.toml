[project]
name = "coop-manager"
version = "0.1.0"
description = "Mitgliederverwaltung der Unser Dorfladen Schlichten eG (FastAPI, Event Sourcing)"
authors = [
    { name = "Matthias Hotzel", email = "github@die-hotzels.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
coop-manager = "coop_manager:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
