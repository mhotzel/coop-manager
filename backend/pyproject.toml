[project]
name = "coop-manager"
version = "0.1.0"
description = "Mitgliederverwaltung der Unser Dorfladen Schlichten eG (FastAPI, Event Sourcing)"
authors = [
    { name = "Matthias Hotzel", email = "github@die-hotzels.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.4.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
coop-manager = "coop_manager.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# D101-D103: Docstring fehlt bei Klasse, Methode, Funktion. D107 (__init__) bleibt aus:
# Ein __init__, das nur Parameter übernimmt, braucht keinen.
extend-select = ["I", "UP", "B", "E501", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
# In Tests sagt der Name der Testfunktion, was geprüft wird.
"tests/**" = ["D101", "D102", "D103"]

[tool.pyright]
include = ["src", "tests"]
reportDeprecated = "warning"
